<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>Bunny Meadow</title>
<link rel="apple-touch-icon" href="clover-icon.png">
<link rel="icon" type="image/png" href="clover-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bunny Meadow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Andika:wght@700&display=swap" rel="stylesheet">
<style>
/* v11: adds Carrot Words, Basket Sort and Letter Trace. Layout concept: a sunny meadow. Chunky white cards float over a sky-to-hill backdrop,
   Clover the rabbit coaches from the corner, and carrots are the tap targets in every game. */
:root{
  color-scheme:light;
  --sky:#bde6fa; --sky-light:#e6f6ff;
  --hill-1:#6fcf6c; --hill-2:#a9e28c;
  --carrot:#ff8a1f; --carrot-deep:#c45100; --carrot-soft:#ffe7cb;
  --leaf:#2f9a4a; --leaf-light:#58c06a;
  --ink:#1f3552; --ink-soft:#4d6482;
  --card:#ffffff; --edge:#cfe6f4; --slot:#f2f9fd; --slot-edge:#9db9cd;
  --good:#23a455; --good-deep:#17773c; --good-soft:#e5f7ec;
  --oops:#ee6352; --sun:#ffd23f; --blush:#ff9eb5;
  --fur:#f7f2fc; --fur-edge:#c9bddb;
  --tile-spell:#fff0d9; --tile-math:#e3f6e0; --tile-adv:#ece6ff; --tile-words:#ffe3ec; --tile-sort:#dff3fb; --tile-trace:#fff4c2;
  --map-top:#cfe9ff; --map-mid:#e3f5cf; --map-low:#b9e59a; --path:#f6e7b8; --path-done:#ffd23f; --lock:#c9d6e0;
  --font-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Avenir Next',system-ui,sans-serif;
  --shadow:0 5px 0 rgba(31,53,82,.12);
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--sky)}
body{
  font-family:var(--font-body);font-weight:700;font-size:18px;color:var(--ink);
  background-color:var(--sky);background-image:linear-gradient(180deg,var(--sky) 0%,var(--sky-light) 75%);
  padding-inline:16px;padding-block:0;min-height:100%;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit}
h2{margin:0}
.hills{position:fixed;left:0;right:0;bottom:0;width:100%;height:20vh;min-height:90px;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:980px;margin-inline:auto;padding-block:12px 160px;display:flex;flex-direction:column;gap:16px}

/* header */
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.top-bar h1{min-width:0;flex:1;margin:0;text-align:center;font:600 clamp(1.35rem,4.5vw,2rem)/1.1 var(--font-display);text-wrap:balance}
.top-right{display:flex;align-items:center;gap:8px}
.icon-btn,.count{flex:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:52px;height:52px;padding:0 14px;border-radius:18px;border:3px solid var(--edge);background:#fff;box-shadow:0 4px 0 var(--edge);cursor:pointer;font:600 1rem var(--font-display)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.icon-btn.invisible{visibility:hidden}
.count{display:flex;align-items:center;gap:6px;height:52px;padding:0 14px 0 10px;border-radius:18px;background:#fff;border:3px solid var(--edge);font:700 1.3rem var(--font-display);font-variant-numeric:tabular-nums}
.count .mini-c{width:22px}
.count.bump{animation:bump .5s}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:14px}

/* cards, buttons, chips */
.card{background:var(--card);border:3px solid var(--edge);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.sec{font:600 1.35rem var(--font-display);margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:600 1.25rem/1 var(--font-display);color:var(--ink);background:var(--carrot);border:0;border-radius:18px;padding:16px 28px;min-height:60px;box-shadow:0 6px 0 var(--carrot-deep);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--carrot-deep)}
.btn.big{font-size:1.5rem;min-height:72px;padding:18px 36px}
.btn.green{background:var(--good);color:#fff;box-shadow:0 6px 0 var(--good-deep)}
.btn.green:active{box-shadow:0 2px 0 var(--good-deep)}
.btn.ghost{background:#fff;box-shadow:0 6px 0 var(--edge);border:3px solid var(--edge)}
.btn.ghost:active{box-shadow:0 2px 0 var(--edge)}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:88px;min-height:78px;padding:10px 18px;border-radius:20px;border:3px solid var(--edge);background:#fff;box-shadow:0 5px 0 var(--edge);cursor:pointer;font:600 1.7rem/1 var(--font-display)}
.chip small{font:700 .85rem var(--font-body);color:var(--ink-soft)}
.chip[aria-pressed="true"]{border-color:var(--carrot);background:var(--carrot-soft);box-shadow:0 5px 0 var(--carrot-deep)}
.chip:active{transform:translateY(3px)}
.setup{display:flex;flex-direction:column;gap:14px}
.setup p{margin:-8px 0 0;color:var(--ink-soft)}

/* home */
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,#fff,#f4fbff)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.game{display:flex;align-items:center;gap:16px;min-height:124px;padding:16px;text-align:left;cursor:pointer;background:var(--tint);border:3px solid var(--edge);border-radius:26px;box-shadow:var(--shadow);transition:transform .1s}
.game:active{transform:translateY(3px)}
.g-ico{flex:none;width:64px}
.g-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.g-t{font:600 1.5rem/1.1 var(--font-display)}
.g-b{color:var(--ink-soft);font-size:1rem}
.home-cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.home-cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.list{display:flex;flex-direction:column;gap:12px;padding:14px}
.mission{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:20px;background:#f7fbfe;border:3px solid var(--edge)}
.mission.done{background:var(--good-soft)}
.m-reward{width:54px;flex:none}
.m-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.m-eyebrow{font:600 .72rem var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.m-title{font:600 1.1rem/1.2 var(--font-display)}
.m-num{font:700 1.2rem var(--font-display);font-variant-numeric:tabular-nums}
.m-num span{color:var(--ink-soft);font-size:.95rem}
.bar{height:14px;border-radius:99px;background:#e1edf5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.book-card{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;cursor:pointer}
.book-card:active{transform:translateY(3px)}
.mini-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.b-count{font:600 1.1rem var(--font-display)}
.b-count b{font-size:1.6rem}

/* stickers */
.stk{display:block;width:100%;aspect-ratio:1;container-type:inline-size;border-radius:20px;background:#fff;box-shadow:0 0 0 4px #fff,0 4px 0 4px rgba(31,53,82,.14);display:grid;place-items:center;transform:rotate(var(--rot,0deg))}
.stk .e{font-size:2rem;font-size:56cqw;line-height:1;display:block}
.stk.locked{background:#e6f1f8;box-shadow:none;border:3px dashed #b3cde0}
.stk.locked .e{filter:brightness(0);opacity:.13}
.stk.big{width:170px;--rot:-6deg}
.book-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 16px;padding:14px;border-radius:20px;background-color:#fbfdff;background-image:radial-gradient(#d4e6f1 1.5px,transparent 1.5px);background-size:22px 22px}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px;background:transparent;border:0;cursor:pointer}
.cell-n{font:600 .95rem var(--font-display);text-align:center}
.cell .stk{max-width:96px}
.cell.wiggle .stk{animation:wiggle .6s}
.note{margin-top:14px;min-height:2.6em;font:600 1.1rem/1.3 var(--font-display);color:var(--ink-soft);text-align:center}

/* play */
.progress{display:flex;gap:8px;justify-content:center}
.pg{width:34px;opacity:.5;filter:grayscale(.5);transition:all .3s}
.pg.done{opacity:1;filter:none}
.pg.now{opacity:.75;filter:none;transform:translateY(-4px)}
.play-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main" "coach"}
.play-grid>.top{grid-area:top}
.play-grid>.main{grid-area:main}
.play-grid>.coach{grid-area:coach}
@media(min-width:900px){
  .play-grid{grid-template-columns:minmax(260px,340px) minmax(0,1fr);grid-template-areas:"top main" "coach main";align-items:start}
  .play-grid>.main{align-self:center}
  .play-grid.math{grid-template-columns:minmax(0,1fr) minmax(230px,300px);grid-template-areas:"top top" "main coach"}
}
.pic-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px 24px}
.pic-card>.equation{width:100%}
.pic{font-size:clamp(5.5rem,26vw,9rem);line-height:1.05;text-align:center}
.say{order:-1;align-self:flex-end;flex:none;width:56px;height:56px;display:grid;place-items:center;border-radius:18px;border:3px solid var(--edge);background:#fff;box-shadow:0 4px 0 var(--edge);cursor:pointer}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.main{display:flex;flex-direction:column;gap:24px;min-width:0}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{display:grid;place-items:center;width:clamp(56px,16vw,88px);aspect-ratio:1;border-radius:20px;border:4px dashed var(--slot-edge);background:var(--slot);font:700 clamp(2rem,9vw,3.4rem)/1 var(--font-display)}
.slot.on{border:4px solid var(--carrot);background:var(--carrot-soft);animation:slotpulse .9s ease-in-out infinite}
.slot.filled{border:4px solid var(--good);background:var(--good-soft);animation:none}
.slot.cheer{animation:cheer .6s both}
.slot.ans{width:clamp(84px,22vw,124px);font-size:clamp(2.4rem,11vw,4rem)}
.choices{display:flex;gap:clamp(8px,2.5vw,22px);justify-content:center;align-items:center;min-height:clamp(96px,27vw,160px)}
.carrot-btn{flex:none;width:clamp(64px,19vw,118px);aspect-ratio:100/134;padding:0;border:0;background:transparent;cursor:pointer;animation:popin .35s var(--d,0s) both}
.carrot-btn:active{transform:scale(.9)}
.carrot-btn.gone{visibility:hidden}
.carrot-btn.fade{opacity:.25;transition:opacity .3s;pointer-events:none}
.carrot-btn.wrong{pointer-events:none}
.carrot-btn.wrong .carrot-svg{animation:shake .45s}
.carrot-btn.hint .carrot-svg{animation:wiggle .8s ease-in-out infinite}
.carrot-svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 0 rgba(31,53,82,.15))}
.carrot-label{fill:#fff;stroke:var(--carrot-deep);stroke-width:5;paint-order:stroke;stroke-linejoin:round;font-family:var(--font-display);font-weight:700}
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hud .progress{justify-content:flex-end}
.lives{display:flex;gap:4px}
.heart{display:block;width:28px;height:26px;overflow:visible}
.heart path{fill:var(--oops);stroke:#b8382a;stroke-width:1.5;transition:fill .3s}
.heart.lost path{fill:#dbe7ef;stroke:#b3cde0}
.heart.lost{animation:bump .5s}
.heart.still{animation:none}
.carrot-svg .spots,.carrot-svg .stink{display:none}
.rotten .c-body{fill:#8f8d3c;stroke:#55521c}
.rotten .c-ridge{stroke:#55521c}
.rotten .carrot-label{stroke:#55521c}
.rotten .leaf1,.rotten .leaf2,.rotten .leaf3{fill:#7a6a3a}
.rotten .c-leaves{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(28deg) scaleY(.75)}
.rotten .spots,.rotten .stink{display:block}
.rotten .stink{fill:none;stroke:#7bb04a;stroke-width:3;stroke-linecap:round;animation:stink 1.2s ease-in-out infinite}
@keyframes stink{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-6px);opacity:.4}}
.lose-note{margin:0;max-width:30ch;color:var(--ink-soft)}
#s-play{display:flex;flex-direction:column;gap:10px}
.g-emoji{display:block;font-size:3.2rem;line-height:1;text-align:center}
/* adventure: guardian bar during a battle */
.bar.hp{height:12px;flex:1;min-width:0;background:#e6ece6}
.foe-face.hit{animation:foehit .6s}
.foe-face.defeated{animation:foedown .9s forwards}
@keyframes foehit{0%{transform:translateX(0);opacity:1}12%{transform:translateX(-12px) rotate(-8deg);opacity:.15}24%{transform:translateX(10px) rotate(7deg);opacity:1}36%{transform:translateX(-8px);opacity:.15}48%{transform:translateX(6px);opacity:1}60%{opacity:.3}72%,100%{transform:translateX(0);opacity:1}}
@keyframes foedown{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-12deg)}100%{transform:scale(.2) rotate(200deg);opacity:0}}
/* adventure: the battle scene */
.arena{position:relative;width:100%;max-width:720px;margin-inline:auto;height:clamp(236px,62vw,280px);border-radius:24px;border:3px solid var(--edge);overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(180deg,#a9dcf6 0%,#dff3ff 54%,#b7e69a 54.2%,#86cf72 100%)}
.fighter{position:absolute;width:clamp(120px,38%,210px);display:flex;flex-direction:column;align-items:center}
.fighter.foe{right:5%;top:11%}
.fighter.me{left:5%;bottom:5%}
.fighter .sprite{position:relative;z-index:1;display:block;line-height:1}
.fighter.foe .sprite{font-size:clamp(3.6rem,16vw,6rem)}
.fighter.me .rabbit-wrap{width:clamp(78px,22vw,130px);position:relative;z-index:1}
.fighter .plat{display:block;width:100%;height:26px;margin-top:-16px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#d4f0a8,#7fc96c);box-shadow:0 4px 0 rgba(31,53,82,.16)}
.plate{position:absolute;z-index:3;display:flex;flex-direction:column;gap:5px;background:#fffdf4;border:3px solid var(--ink);border-radius:14px 14px 14px 4px;padding:6px 10px;box-shadow:0 3px 0 rgba(31,53,82,.25)}
.foe-plate{left:3%;top:9%;width:clamp(150px,52%,300px)}
.me-plate{right:3%;bottom:10%;width:clamp(130px,42%,220px);border-radius:14px 14px 4px 14px}
.plate-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 1rem var(--font-display)}
.plate-top span{font:700 .8rem var(--font-display);color:var(--ink-soft)}
.hpline{display:flex;align-items:center;gap:6px}
.hp-label{font:700 .7rem var(--font-display);color:#fff;background:var(--ink);padding:1px 6px;border-radius:6px}
.hp-i{transition:width .6s ease,background-color .3s}
.plate .lives{gap:3px}
.plate .heart{width:24px;height:22px}
:where(.arena.enter .fighter.foe .sprite){animation:slideR .7s ease-out backwards}
:where(.arena.enter .fighter.me .rabbit-wrap){animation:slideL .7s ease-out backwards}
.shot{position:absolute;z-index:4;width:30px;height:40px;pointer-events:none;transform:translate(-50%,-50%)}
.shot .carrot-svg{filter:none}
.dmg{position:absolute;z-index:6;transform:translate(-50%,0);pointer-events:none;font:700 1.9rem var(--font-display);text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:dmgup .95s ease-out forwards}
.dmg.good{color:var(--carrot-deep)}
.dmg.bad{color:var(--oops)}
.rabbit-wrap.hurt{animation:cloverhit .6s}
.rabbit-wrap.fainted{animation:faint .9s forwards}
.battle-say{display:block}
.battle-say .bubble{text-align:center}
.battle-say .bubble::after{display:none}
@keyframes slideR{from{transform:translateX(170%);opacity:0}}
@keyframes slideL{from{transform:translateX(-170%);opacity:0}}
@keyframes dmgup{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.25)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
@keyframes cloverhit{0%{transform:translateX(0);opacity:1}12%{transform:translateX(10px) rotate(6deg);opacity:.15}24%{transform:translateX(-9px) rotate(-5deg);opacity:1}36%{transform:translateX(7px);opacity:.15}48%{transform:translateX(-5px);opacity:1}60%{opacity:.3}72%,100%{transform:translateX(0);opacity:1}}
@keyframes faint{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(46%) rotate(78deg);opacity:0}}
/* adventure: map */
.map-head{padding:12px 18px}
.map-head .mh{font:600 1.2rem/1.25 var(--font-display)}
.map-head small{display:block;margin-top:3px;font:700 .95rem/1.3 var(--font-body);color:var(--ink-soft)}
.map{position:relative;width:100%;max-width:520px;margin:14px auto 0;aspect-ratio:400/1100;border-radius:28px;border:3px solid var(--edge);background:linear-gradient(180deg,var(--map-top) 0%,var(--map-mid) 40%,var(--map-low) 100%);box-shadow:var(--shadow);overflow:hidden}
.trail{position:absolute;inset:0;width:100%;height:100%}
.trail path{fill:none;stroke-width:14;stroke-linecap:round;stroke-dasharray:2 24}
.trail-all{stroke:var(--path)}
.trail-done{stroke:var(--path-done)}
.scene{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;opacity:.92}
.node{position:absolute;transform:translate(-50%,-50%);width:68px;height:68px;padding:0;border-radius:50%;border:5px solid #fff;display:grid;place-items:center;background:var(--lock);font-size:1.9rem;cursor:pointer;box-shadow:0 5px 0 rgba(31,53,82,.2)}
.node.done{background:var(--good-soft);border-color:var(--good)}
.node.now{background:var(--carrot-soft);border-color:var(--carrot);animation:nodeglow 1.3s ease-in-out infinite}
.node.locked .n-face{opacity:.55}
.node.shake{animation:nodeshake .45s}
.n-face{line-height:1}
.n-num{position:absolute;left:-8px;top:-8px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;background:var(--ink);color:#fff;font:700 .85rem var(--font-display)}
.n-name{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 10px;border-radius:12px;background:#fff;border:2px solid var(--edge);font:600 .85rem var(--font-display);color:var(--ink)}
.clover-mark{position:absolute;width:46px;transform:translate(-50%,calc(-100% - 40px));pointer-events:none;z-index:2;animation:markhop 1.2s ease-in-out infinite}
.clover-mark .rabbit{display:block;width:100%}
@keyframes markhop{0%,100%{transform:translate(-50%,calc(-100% - 40px))}50%{transform:translate(-50%,calc(-100% - 50px))}}
@keyframes nodeglow{0%,100%{box-shadow:0 5px 0 rgba(31,53,82,.2),0 0 0 0 rgba(255,138,31,.6)}50%{box-shadow:0 5px 0 rgba(31,53,82,.2),0 0 0 14px rgba(255,138,31,0)}}
@keyframes nodeshake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 9px),-50%)}75%{transform:translate(calc(-50% + 9px),-50%)}}
.intro-card .foe{font-size:6rem;line-height:1.1}
.intro-card p{font-size:1.15rem}
.intro-card .actions{margin-top:4px}
/* ---- Carrot Words ---- */
.word-prompt{align-items:center;padding:14px 16px 18px}
.say.big{order:0;align-self:center;width:clamp(84px,24vw,104px);height:clamp(84px,24vw,104px);border-radius:50%}
.say.big svg{width:46px;height:46px}
.prompt-hint{font:700 .95rem var(--font-body);color:var(--ink-soft);margin-top:6px}
.wgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);width:100%}
.wgrid.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
.word-btn{min-height:clamp(70px,19vw,96px);padding:6px 10px;border-radius:22px;border:4px solid var(--carrot);background:#fff;color:var(--ink);font:700 clamp(2.1rem,9.5vw,3.1rem)/1 var(--font-display);box-shadow:0 6px 0 var(--carrot-deep);cursor:pointer;animation:popin .35s var(--d,0s) both;transition:transform .1s}
.word-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--carrot-deep)}
.word-btn.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 6px 0 var(--good-deep)}
.word-btn.fade{opacity:.3;pointer-events:none}

<script>
/* ---------- Pure game logic (no DOM) ---------- */
const VOWELS=['a','e','i','o','u'];
const CONS='bcdfghjklmnpqrstvwxyz'.split('');
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Spelling words, grouped by length: [word, picture]. Add words here any time. */
const WORDS={
  3:[['dog','🐶'],['cat','🐱'],['sun','☀️'],['pig','🐷'],['hat','🎩'],['bus','🚌'],['bed','🛏️'],['fox','🦊'],['ant','🐜'],['bat','🦇'],['map','🗺️'],['pen','🖊️'],['web','🕸️'],['rat','🐀'],['nut','🥜'],['box','📦'],['van','🚐'],['gem','💎'],['log','🪵']],
  4:[['frog','🐸'],['duck','🦆'],['fish','🐟'],['ship','🚢'],['drum','🥁'],['milk','🥛'],['bell','🔔'],['gift','🎁'],['ring','💍'],['sock','🧦'],['tent','⛺'],['nest','🪺'],['crab','🦀'],['moon','🌙'],['star','⭐'],['tree','🌳'],['corn','🌽'],['hand','✋']],
  5:[['robot','🤖'],['tiger','🐯'],['zebra','🦓'],['lemon','🍋'],['truck','🚚'],['plant','🌱'],['panda','🐼'],['camel','🐫'],['tulip','🌷'],['skunk','🦨'],['spoon','🥄'],['melon','🍈']]
};

/* Four carrot choices for one blank: vowels get vowel choices, consonants get consonant choices. */
function spellOptions(word,pos,n){
  n=n||4;
  const ch=word[pos],isV=VOWELS.includes(ch);
  const pool=(isV?VOWELS:CONS).filter(x=>x!==ch);
  return shuffle([ch].concat(shuffle(pool).slice(0,n-1)));
}

/* One sum. op: 'add' | 'sub' | 'mix'. max: biggest number allowed in the sum. */
function makeMathQ(op,max,lastKey){
  let q,tries=0;
  do{
    const o=op==='mix'?(Math.random()<.5?'add':'sub'):op;
    const lo=Math.max(2,Math.round(max*.3));
    let a,b,ans;
    if(o==='add'){const total=rnd(lo,max);a=rnd(1,total-1);b=total-a;ans=total;}
    else{a=rnd(lo,max);b=rnd(1,a-1);ans=a-b;}
    q={op:o,a:a,b:b,ans:ans,key:o+a+'_'+b};
  }while(q.key===lastKey&&++tries<10);
  const hi=Math.max(q.op==='add'?max:q.a,5);
  const offs=shuffle([-1,1,-2,2,-3,3]);
  if(max>=20)offs.push.apply(offs,shuffle([-10,10]));
  const set=new Set([q.ans]);
  for(const d of offs){if(set.size>=4)break;const v=q.ans+d;if(v>=0&&v<=hi)set.add(v);}
  while(set.size<4)set.add(rnd(0,hi));
  q.options=[...set].sort((x,y)=>x-y);
  return q;
}

/* ---- Sight words, sorting and tracing: pure logic (tested in Node) ---- */
const SIGHT=[{"id": 1, "name": "First words", "words": ["I", "the", "and", "to", "is", "it", "in", "my", "me", "we", "you", "can", "see", "go", "up", "no"]}, {"id": 2, "name": "More words", "words": ["look", "like", "at", "am", "he", "she", "on", "so", "do", "are", "was", "said", "for", "come", "here", "play", "run", "big", "little", "not"]}, {"id": 3, "name": "Big words", "words": ["that", "this", "they", "with", "have", "what", "want", "went", "there", "where", "good", "yes", "will", "all", "but", "one", "two", "three", "down", "away", "help", "find", "make", "jump"]}];
const SORT_CATS=[{"id": "fruit", "name": "Fruit", "icon": "🍎", "color": "#e8503f", "items": [["apple", "🍎"], ["banana", "🍌"], ["grapes", "🍇"], ["strawberry", "🍓"], ["orange", "🍊"], ["watermelon", "🍉"], ["pear", "🍐"], ["cherries", "🍒"], ["lemon", "🍋"], ["pineapple", "🍍"]]}, {"id": "veg", "name": "Vegetables", "icon": "🥕", "color": "#3f9d4f", "items": [["carrot", "🥕"], ["broccoli", "🥦"], ["corn", "🌽"], ["potato", "🥔"], ["cucumber", "🥒"], ["onion", "🧅"], ["pepper", "🫑"], ["lettuce", "🥬"]]}, {"id": "animals", "name": "Animals", "icon": "🐶", "color": "#a8703a", "items": [["dog", "🐶"], ["cat", "🐱"], ["cow", "🐮"], ["pig", "🐷"], ["elephant", "🐘"], ["lion", "🦁"], ["frog", "🐸"], ["monkey", "🐵"], ["horse", "🐴"], ["chicken", "🐔"], ["sheep", "🐑"], ["duck", "🦆"], ["bear", "🐻"], ["turtle", "🐢"]]}, {"id": "vehicles", "name": "Vehicles", "icon": "🚗", "color": "#3d7fd1", "items": [["car", "🚗"], ["bus", "🚌"], ["train", "🚂"], ["airplane", "✈️"], ["bicycle", "🚲"], ["tractor", "🚜"], ["truck", "🚚"], ["helicopter", "🚁"], ["ambulance", "🚑"], ["ship", "🚢"]]}, {"id": "clothes", "name": "Clothes", "icon": "👕", "color": "#8e5bc4", "items": [["shirt", "👕"], ["pants", "👖"], ["socks", "🧦"], ["shoe", "👟"], ["cap", "🧢"], ["mittens", "🧤"], ["scarf", "🧣"], ["dress", "👗"], ["coat", "🧥"], ["shorts", "🩳"]]}];
function pickSight(pool,stats,n){
  const out=[],cnt={};let fresh=0;
  for(let i=0;i<n;i++){
    const last=out[out.length-1];
    const ws=pool.map(function(w){
      if(w===last||(cnt[w]||0)>=2)return 0;
      const s=stats[w];
      if(!s)return (cnt[w]||fresh<4)?2.2:0;
      const m=Math.max(0,s.c-2*s.w);
      return m>=4?0.5:(m>=2?1.5:3);
    });
    const tot=ws.reduce(function(a,b){return a+b;},0);
    let w;
    if(tot<=0){const left=pool.filter(function(x){return x!==last&&(cnt[x]||0)<2;});w=left.length?left[rnd(0,left.length-1)]:pool[rnd(0,pool.length-1)];}
    else{let x=Math.random()*tot,j=0;while(j<ws.length-1&&(ws[j]===0||x>=ws[j])){x-=ws[j];j++;}w=pool[j];}
    if(!stats[w]&&!cnt[w])fresh++;
    cnt[w]=(cnt[w]||0)+1;out.push(w);
  }
  return out;
}
function sightOptions(word,universe,k){
  const pool=universe.filter(function(w){return w.toLowerCase()!==word.toLowerCase();});
  const scored=shuffle(pool).map(function(w){
    let s=Math.random()*1.2;
    if(w[0].toLowerCase()===word[0].toLowerCase())s+=2;
    if(w.length===word.length)s+=1;
    return [w,s];
  }).sort(function(a,b){return b[1]-a[1];});
  const opts=scored.slice(0,k-1).map(function(x){return x[0];});
  opts.push(word);
  return shuffle(opts);
}
function buildSort(cats,nb,n,lastKey){
  let pick,tries=0;
  do{pick=shuffle(cats).slice(0,nb);tries++;}while(lastKey&&pick.map(function(c){return c.id;}).sort().join()===lastKey&&tries<8);
  const counts=pick.map(function(){return Math.floor(n/nb);});
  const extra=n-counts.reduce(function(a,b){return a+b;},0);
  const idx=shuffle(pick.map(function(_,i){return i;}));
  for(let i=0;i<extra;i++)counts[idx[i]]++;
  let items=[];
  pick.forEach(function(c,ci){shuffle(c.items).slice(0,counts[ci]).forEach(function(it){items.push({n:it[0],e:it[1],cat:c.id});});});
  items=shuffle(items);
  for(let t=0;t<6;t++){let bad=false;for(let i=2;i<items.length;i++)if(items[i].cat===items[i-1].cat&&items[i].cat===items[i-2].cat){bad=true;break;}if(!bad)break;items=shuffle(items);}
  return {cats:pick,items:items};
}

var AC=null;
function tone(f,t,d,type,v){
  var now=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,now+t);
  g.gain.exponentialRampToValueAtTime(v||.16,now+t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,now+t+d);
  o.connect(g);g.connect(AC.destination);o.start(now+t);o.stop(now+t+d+.05);
}
function sfx(k){
  if(!S.prefs.sound)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(k==='pop'){tone(660,0,.12);tone(880,.08,.16);}
    else if(k==='oops'){tone(220,0,.18,'triangle',.14);tone(180,.12,.2,'triangle',.12);}
    else if(k==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,i*.11,.22);});}
    else if(k==='sticker'){[523,659,784,988,1319].forEach(function(f,i){tone(f,i*.1,.28,'triangle');});}
    else if(k==='tick'){tone(500,0,.06);}
    else if(k==='hit'){tone(320,0,.07,'square',.12);tone(140,.06,.14,'square',.1);}
    else if(k==='squeak'){tone(1100,0,.08,'triangle',.1);tone(1500,.07,.1,'triangle',.08);}
  }catch(e){}
}

function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();return AC;}
function clipBuffer(key){
  if(BUF[key])return BUF[key];
  BUF[key]=new Promise(function(res){
    var b64=CL[key];if(!b64){res(null);return;}
    try{
      var bin=atob(b64),u=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      var p=ctx().decodeAudioData(u.buffer,function(b){res(b||null);},function(){res(null);});
      if(p&&p.then)p.then(function(b){res(b||null);},function(){res(null);});
    }catch(e){res(null);}
  });

function ttsBackup(text,clover,done){
  try{
    var u=new SpeechSynthesisUtterance(text);u.lang='en-US';
    if(clover){u.rate=1.05;u.pitch=1.9;}else{u.rate=.8;}
    u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  }catch(e){done();}

function pump(){
  if(vBusy||!VQ.length)return;

  clipBuffer(it[0]).then(function(b){

    if(b){
      try{var s=ctx().createBufferSource();s.buffer=b;s.connect(AC.destination);s.onended=next;vSrc=s;s.start();return;}catch(e){}
    }
    if(it[1])ttsBackup(it[1],it[0].charAt(0)==='c',next);else next();
  });

    if(!queue)stopVoice();

    if(c.state==='running')pump();
    else if(c.resume)c.resume().then(function(){if(gen===vGen&&c.state==='running')pump();else if(gen===vGen)VQ.length=0;},function(){VQ.length=0;});
  }catch(e){}

function fly(fromEl,toEl,done){

  var g=document.createElement('div');g.className='flyer';g.innerHTML=fromEl.innerHTML;
  g.style.cssText='left:'+a.left+'px;top:'+a.top+'px;width:'+a.width+'px;height:'+a.height+'px';
  document.body.appendChild(g);
  var dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);
  var sc=Math.min(b.width/a.width,b.height/a.height)*.75;
  fromEl.classList.add('gone');
  var an=g.animate([
    {transform:'translate(0,0) scale(1) rotate(0deg)'},
    {transform:'translate('+(dx*.6)+'px,'+(dy*.6-50)+'px) scale('+((1+sc)/2)+') rotate(-14deg)',offset:.6},
    {transform:'translate('+dx+'px,'+dy+'px) scale('+sc+') rotate(0deg)'}

function centreIn(el,box){
  var a=el.getBoundingClientRect(),b=box.getBoundingClientRect();
  return {x:a.left+a.width/2-b.left,y:a.top+a.height/2-b.top};
}
function damagePop(arena,target,txt,cls){
  var d=document.createElement('div'),c=centreIn(target,arena);
  d.className='dmg '+cls;d.textContent=txt;d.style.left=c.x+'px';d.style.top=(c.y-target.getBoundingClientRect().height/2+12)+'px';
  arena.appendChild(d);setTimeout(function(){d.remove();},1000);
}
/* Right answer: Clover throws a carrot, the guardian is hit and loses health. */
function attackFoe(r){
  if(!r.stage)return;
  r.hpDone=Math.min(r.hpMax,r.hpDone+1);
  var arena=$('#arena'),me=$('#coach'),foe=$('#foeFace'),hp=$('#foeHp');
  if(!arena||!me||!foe)return;
  var pct=Math.round((r.hpMax-r.hpDone)/r.hpMax*100),dead=r.hpDone>=r.hpMax;
  var impact=function(){
    sfx('hit');
    if(hp){hp.style.width=pct+'%';hp.style.background=hpColor(pct);}
    var bar=hp&&hp.parentNode;if(bar)bar.setAttribute('aria-valuenow',pct);
    foe.classList.remove('hit','defeated');void foe.offsetWidth;foe.classList.add(dead?'defeated':'hit');
    damagePop(arena,foe,'-1','good');
  };
  if(reduce||!arena.animate){impact();return;}
  setTimeout(function(){
    if(!arena.isConnected)return;
    var a=centreIn(me,arena),b=centreIn(foe,arena);
    var shot=document.createElement('div');shot.className='shot';shot.innerHTML=carrotSVG('');
    shot.style.left=a.x+'px';shot.style.top=(a.y-10)+'px';arena.appendChild(shot);
    var dx=b.x-a.x,dy=b.y-a.y+10;
    me.animate([{transform:'translate(0,0)'},{transform:'translate('+(dx*.16)+'px,'+(dy*.16)+'px)',offset:.4},{transform:'translate(0,0)'}],{duration:420,easing:'ease-out'});
    var an=shot.animate([
      {transform:'translate(-50%,-50%) rotate(0deg) scale(.8)'},
      {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) rotate(560deg) scale(1.05)'}
    ],{duration:380,easing:'cubic-bezier(.4,0,.8,.6)'});
    an.onfinish=function(){shot.remove();impact();};
  },230);
}
/* Wrong answer: the guardian charges at Clover, she is hit and loses a heart. */
function attackMe(r){
  var arena=$('#arena'),me=$('#coach'),foe=$('#foeFace');
  if(!arena||!me||!foe)return;
  var lives=r.lives,dead=lives<=0;
  var impact=function(){
    me.classList.remove('hurt','fainted');void me.offsetWidth;me.classList.add(dead?'fainted':'hurt');
    damagePop(arena,me,'-1','bad');
    var hs=$$('.heart');if(hs[lives])hs[lives].classList.add('lost');
  };
  if(reduce||!foe.animate){impact();return;}
  var a=centreIn(foe,arena),b=centreIn(me,arena);
  foe.animate([
    {transform:'translate(0,0) scale(1)'},
    {transform:'translate('+((b.x-a.x)*.72)+'px,'+((b.y-a.y)*.72)+'px) scale(1.18)',offset:.42},
    {transform:'translate(0,0) scale(1)'}
  ],{duration:560,easing:'ease-in-out'});
  setTimeout(impact,230);
}

      for(var k=0;k<=n;k++){
        var x=a[0]+(b[0]-a[0])*k/n,y=a[1]+(b[1]-a[1])*k/n;
        for(var j=0;j<st.samples.length;j++){var s=st.samples[j];if(!s[2]&&(s[0]-x)*(s[0]-x)+(s[1]-y)*(s[1]-y)<=R2){s[2]=1;st.cov++;}}
      }
    }
    function after(){
      var prog=st.cov/Math.max(1,st.samples.length);
      var bar=$('#trBar');if(bar)bar.style.width=Math.min(100,Math.round(prog/TR_PASS*100))+'%';
      if(prog>=TR_PASS&&!r.lock){self.complete(st);return;}
      if(!st.dirty){st.dirty=true;requestAnimationFrame(function(){st.dirty=false;if(!r.lock)self.paint(st);});}
    }
    cv.onpointerdown=function(e){
      if(r.lock)return;
      drawing=true;pid=e.pointerId;try{cv.setPointerCapture(pid);}catch(_){}
      last=pos(e);seg(last,last);after();e.preventDefault();
    };
    cv.onpointermove=function(e){
      if(!drawing||e.pointerId!==pid||r.lock)return;
      var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];if(!evs.length)evs=[e];
      evs.forEach(function(ev){var p=pos(ev);seg(last,p);last=p;});
      after();
    };
    function up(e){
      if(e.pointerId!==pid)return;drawing=false;pid=null;
      var prog=st.cov/Math.max(1,st.samples.length);
      if(!r.lock&&prog>.12&&prog<TR_PASS&&Date.now()-r.lastKeep>6000){r.lastKeep=Date.now();say('trace_keep');}
    }
    cv.onpointerup=up;cv.onpointercancel=up;
  },
  complete:function(st){
    var self=this,r=this.r,isNum=r.set==='num',arr=TR_SETS[r.set],ch=arr[r.items[r.i]],last=r.i===r.n-1;
    r.lock=true;
    this.paint(st,true);
    $('#trWrap').classList.add('done');$('#trBar').style.width='100%';
    sfx('win');confetti(14);
    S.stats[isNum?'trn':'tr']++;
    S.trace[r.set]=(r.items[r.i]+1)%arr.length;
    earn(r,2);r.perfect++;save();
    voice([trItem(r.set,ch),['c.trace_ok',LINES.trace_ok.toLowerCase()]]);
    bubble('trace_ok');mood($('#coach'),'happy',99999);
    var pg=$$('.pg')[r.i];if(pg)pg.classList.add('done');
    $('#clearBtn').hidden=true;
    var nb=$('#nextBtn');nb.hidden=false;nb.innerHTML=last?ic('\uD83E\uDD55','See my carrots'):ic('\u27A1\uFE0F','Next');
    nb.onclick=function(){
      if(last){r.extra='<b>'+r.n+'</b> '+(isNum?'numbers':'letters')+' traced';finishRound('trace',r);}
      else{r.i++;self.show();}
    };
  }
};
GAMES.push(Adventure,Spell,MathG,SightG,SortG,TraceG);
function gameById(id){return GAMES.filter(function(g){return g.id===id;})[0];}

/* ---------- Screens ---------- */
var SCREENS=['home','setup','play','results','stickers','who'],cur='home',curGame=null,curStage=null,lastRound=null;
function go(name,arg){
  cur=name;
  closeIntro();
  if(name!=='play')checkMissions();
  SCREENS.forEach(function(s){$('#s-'+s).hidden=s!==name;});
  var title='Bunny Meadow';
  if(name==='home')renderHome();
  else if(name==='setup'){curGame=gameById(arg);curStage=null;title=curGame.title;curGame.setup($('#s-setup'));}
  else if(name==='play')title=curStage?curStage.st.name:curGame.title;
  else if(name==='results'){title=(lastRound&&lastRound.lost)?'Try again!':(lastRound&&typeof lastRound.stage==='number'?(lastRound.final?'You did it!':'Stop cleared!'):'Great job!');renderResults();}
  else if(name==='stickers'){title='Sticker Book';renderStickers();}
  else if(name==='who'){title='Who is playing?';renderWho();}
  $('#screenTitle').textContent=title;
  $('#backBtn').classList.toggle('invisible',name==='home'||name==='who');
  window.scrollTo(0,0);
  if(name==='home'&&audioReady&&KEY){var hb=$('#s-home .bubble');if(hb)clover(hb.dataset.key);}
  if(name!=='play'&&name!=='setup')setTimeout(flushReveal,name==='results'?900:500);
}
function finishRound(id,r){
  S.stats.rounds++;
  var info={game:id,carrots:r.carrots,perfect:r.perfect,n:r.n,extra:r.extra};
  if(r.stage){
    info.stage=r.stage.i;
    earn(r,3);info.carrots=r.carrots;
    if(r.stage.i===S.stats.adv)S.stats.adv++;
    info.final=r.stage.i===STAGES.length-1;
  }
  save();lastRound=info;
  go('results');confetti(info.final?60:24);
}

/* A wrong carrot rotten-ifies and costs one of three lives. Returns true when the round is lost. */
function oops(r,btn,id){
  r.mist++;r.lives--;sfx('oops');
  var cs=btn.querySelector('.carrot-svg');if(cs)cs.classList.add('rotten');
  btn.classList.add('wrong');
  mood($('#coach'),'oops',700);
  if(r.stage)attackMe(r);
  else{var hs=$$('.heart');if(hs[r.lives])hs[r.lives].classList.add('lost');}
  var lv=$('.lives');if(lv)lv.setAttribute('aria-label',r.lives+' lives left');
  if(r.lives<=0){
    r.lock=true;
    say((id==='words'||id==='sort')?'odead':'dead',true);
    setTimeout(function(){loseRound(id,r);},reduce?700:(r.stage?2200:1500));
    return true;
  }
  var nk=(id==='words'||id==='sort')?'o':'rot';
  say(r.lives===1?nk+'1':nk+'2',true);
  return false;
}
function loseRound(id,r){
  S.stats.streak=0;save();
  lastRound={game:id,carrots:r.carrots,perfect:r.perfect,lost:true,done:r.i,n:r.n,stage:r.stage?r.stage.i:undefined};
  go('results');
}
function missionCard(track){
  var m=MISSIONS.filter(function(x){return x.t===track&&!S.stickers[x.r];})[0];
  if(!m)return '<div class="mission done"><div class="m-body"><div class="m-eyebrow">'+track+'</div><div class="m-title">All '+track+' missions done!</div></div></div>';
  var v=Math.min(val(m),m.g),pct=Math.round(v/m.g*100);
  return '<div class="mission"><div class="m-reward">'+stk(stickerById(m.r),true)+'</div><div class="m-body"><div class="m-eyebrow">'+track+'</div><div class="m-title">'+m.x+'</div>'+
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+m.g+'" aria-valuenow="'+v+'"><i style="width:'+pct+'%"></i></div></div>'+
    '<div class="m-num">'+v+'<span>/'+m.g+'</span></div></div>';
}
function renderHome(){
  var got=Object.keys(S.stickers).length;
  var hk=got?'back':'hello';
  var recent=Object.keys(S.stickers).sort(function(a,b){return S.stickers[b]-S.stickers[a];}).slice(0,4);
  var row='';
  for(var i=0;i<4;i++)row+=recent[i]?stk(stickerById(recent[i]),false,[-4,3,-2,5][i]):'<span class="stk locked"><span class="e">?</span></span>';
  $('#s-home').innerHTML=
    '<div class="card hero">'+(profById(P.active)?'<button class="who-chip" data-go="who" aria-label="Change player"><span class="av">'+profById(P.active).av+'</span>'+(profById(P.active).name?'<span>'+esc(profById(P.active).name)+'</span>':'')+'<span class="sw" aria-hidden="true">\uD83D\uDD04</span></button>':'')+'<div class="rabbit-wrap" id="homeRabbit">'+rabbit()+'</div><div class="bubble" id="bubble" data-key="'+hk+'">'+LINES[hk]+'</div></div>'+
    '<h2 class="sec" style="margin-top:20px">Pick a game</h2>'+
    '<div class="games">'+GAMES.map(function(g){
      return '<button class="game" style="--tint:'+g.tint+'" data-game="'+g.id+'"><span class="g-ico">'+g.icon()+'</span><span class="g-txt"><span class="g-t">'+g.title+'</span><span class="g-b">'+g.blurb+'</span></span></button>';
    }).join('')+'</div>'+
    '<div class="home-cols" style="margin-top:20px"><section><h2 class="sec">Missions</h2><div class="card list">'+TRACKS.map(missionCard).join('')+'</div></section>'+
    '<section><h2 class="sec">Sticker book</h2><button class="card book-card" data-go="stickers"><span class="mini-row">'+row+'</span>'+
      '<span class="b-count"><b>'+got+'</b> of '+STICKERS.length+' stickers</span>'+
      '<span class="bar"><i style="width:'+Math.round(got/STICKERS.length*100)+'%"></i></span>'+
      '<span class="btn" style="text-align:center">'+ic('\uD83D\uDCD6','Open my book')+'</span></button></section></div>';
  var hr=$('#homeRabbit');setTimeout(function(){if(hr.isConnected)mood(hr,'happy',1300);},300);
}
function renderResults(){
  var r=lastRound||{carrots:0,perfect:0},n=r.n||ROUND,adv=typeof r.stage==='number',st=adv?STAGES[r.stage]:null;
  var nextI=(adv&&!r.lost&&r.stage+1<STAGES.length&&r.stage+1<=S.stats.adv)?r.stage+1:-1;
  var head=adv?(r.lost?'The guardian won!':(r.final?'Adventure complete!':'Stop cleared!')):(r.lost?'Out of lives!':'Round complete!');
  var note='';
  if(adv&&r.lost)note='The '+st.foeName+' blocked the way. Try again and you can beat it!';
  else if(adv)note='You beat the '+st.foeName+'! '+(r.final?'The meadow is saved!':(nextI>-1?'Next up: '+STAGES[nextI].name+'.':'Pick any stop on the map.'));
  else if(r.lost)note='Three rotten carrots. Clover keeps the carrots you already collected.';
  var btns;
  if(adv&&r.lost)btns='<button class="btn big" id="againBtn">'+ic('\uD83D\uDD04','Try again')+'</button><button class="btn ghost big" id="mapBtn">'+ic('\uD83D\uDDFA\uFE0F','Map')+'</button>';
  else if(adv)btns=(nextI>-1?'<button class="btn big" id="nextStopBtn">'+ic('\uD83D\uDEA9','Next stop')+'</button>':'')+'<button class="btn '+(nextI>-1?'ghost ':'')+'big" id="mapBtn">'+ic('\uD83D\uDDFA\uFE0F','Map')+'</button>';
  else btns='<button class="btn big" id="againBtn">'+ic('\uD83D\uDD04',r.lost?'Try again':'Play again')+'</button><button class="btn ghost big" id="homeBtn2">'+ic('\uD83C\uDFE0','Home')+'</button>';
  $('#s-results').innerHTML='<div class="card results"><div class="rabbit-wrap big '+(r.lost?'oops':'happy')+'">'+rabbit()+'</div><h2>'+head+'</h2>'+
    (note?'<p class="lose-note">'+note+'</p>':'')+
    '<div class="tally"><div class="tl"><span class="mini-c">'+carrotSVG('')+'</span><b>'+r.carrots+'</b> '+(r.carrots===1?'carrot':'carrots')+' this round</div>'+
    (r.lost?'<div class="tl"><b>'+r.done+'</b> of '+n+' finished</div>':(r.extra?'<div class="tl">'+r.extra+'</div>':'<div class="tl"><b>'+r.perfect+'</b> of '+n+' with no mistakes</div>'))+'</div>'+
    '<div class="actions">'+btns+'</div></div>';
  var ab=$('#againBtn');
  if(ab)ab.onclick=function(){sfx('pop');if(adv)startStage(r.stage);else{curGame=gameById(lastRound.game);curGame.start();}};
  var hb=$('#homeBtn2');if(hb)hb.onclick=function(){go('home');};
  var mb=$('#mapBtn');if(mb)mb.onclick=function(){sfx('tick');go('setup','adventure');};
  var nb=$('#nextStopBtn');if(nb)nb.onclick=function(){sfx('tick');go('setup','adventure');showIntro(nextI);};
  clover(adv?(r.lost?'advlose':(r.final?'advfinal':'beat')):(r.lost?'lose':'win'));
}

function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function renderWho(){
  var el=$('#s-who');
  if(!P.list.length){
    el.innerHTML='<div class="card" style="text-align:center"><h2 class="sec" style="margin:0 0 6px">Welcome!</h2><p class="pm-note" style="margin-bottom:14px">Grown-up step: add a player for each child. Each one gets their own carrots and stickers, saved only on this device.</p><div class="actions"><button class="btn big" id="firstAdd">'+ic('\u2795','Add a player')+'</button></div></div>';
    $('#firstAdd').onclick=function(){openManage(true);};
    return;
  }
  el.innerHTML='<h2 class="sec" style="text-align:center;margin-top:8px">Who is playing?</h2><div class="who-grid">'+
    P.list.map(function(p){return '<button class="who" data-id="'+p.id+'"><span class="who-av">'+p.av+'</span><span class="who-n">'+esc(p.name)+'</span></button>';}).join('')+
    '</div><div class="actions"><button class="btn ghost hold" id="guBtn"><span class="bi" aria-hidden="true">\uD83D\uDC6A</span><span>Grown-ups: hold</span><i></i></button></div>';
  $$('.who',el).forEach(function(b){b.onclick=function(){
    sfx('pop');stopVoice();setActive(b.dataset.id);paintSound();updateCount();go('home');
    var hr=$('#homeRabbit');if(hr)mood(hr,'happy',1300);
  };});
  var g=$('#guBtn'),bar=$('i',g),t0=0,raf=0,done=false;
  function tick(){
    var f=Math.min(1,(Date.now()-t0)/1200);bar.style.width=(f*100)+'%';
    if(f>=1){done=true;stop();openManage(false);}else raf=requestAnimationFrame(tick);
  }
  function stop(){cancelAnimationFrame(raf);bar.style.width='0';t0=0;}
  g.addEventListener('pointerdown',function(e){done=false;t0=Date.now();tick();});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){g.addEventListener(ev,function(){if(t0)stop();});});
  g.addEventListener('contextmenu',function(e){e.preventDefault();});
  g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openManage(false);}});
}
function openManage(firstRun){
  var m=$('#pm');m.hidden=false;
  var sel=null,armedId=null,armT;
  function taken(){return P.list.map(function(p){return p.av;});}
  function paint(){
    if(sel===null||taken().indexOf(sel)>-1)sel=AVATARS.filter(function(a){return taken().indexOf(a)<0;})[0]||null;
    m.innerHTML='<div class="modal-card pm-card"><h3>Players on this device</h3>'+
      '<p class="pm-note">Progress is saved only in this browser on this device. It is never sent anywhere, and nobody else who opens the game will see these players.</p>'+
      P.list.map(function(p){return '<div class="pm-row" data-id="'+p.id+'"><button class="pm-av" data-act="av" aria-label="Change picture">'+p.av+'</button><input class="pm-in" data-act="nm" maxlength="16" placeholder="Name (optional)" value="'+esc(p.name)+'"><button class="pm-del'+(armedId===p.id?' armed':'')+'" data-act="del" aria-label="Delete player">'+(armedId===p.id?'Tap to confirm':'\uD83D\uDDD1\uFE0F')+'</button></div>';}).join('')+
      '<h3 style="margin-top:6px">Add a player</h3>'+
      (sel?'<div class="pm-avs">'+AVATARS.map(function(a){return '<button data-act="pick" data-a="'+a+'"'+(taken().indexOf(a)>-1?' disabled':'')+(a===sel?' class="on"':'')+'>'+a+'</button>';}).join('')+'</div>'+
      '<div class="pm-row"><input class="pm-in" id="pmNew" maxlength="16" placeholder="Name (optional)"><button class="btn green" id="pmAdd" style="padding:14px 18px;min-height:56px">'+ic('\u2795','Add')+'</button></div>':'<p class="pm-note">All the pictures are in use.</p>')+
      '<div class="actions"><button class="btn big" id="pmDone">'+ic('\u2705','Done')+'</button></div></div>';
  }
  function close(){
    m.hidden=true;m.innerHTML='';
    if(firstRun&&P.list.length===1){setActive(P.list[0].id);paintSound();updateCount();go('home');}
    else if(cur==='who')renderWho();
    else if(cur==='home')renderHome();
  }
  m.onclick=function(e){
    var b=e.target.closest('[data-act],#pmAdd,#pmDone');if(!b)return;
    var row=b.closest('.pm-row'),id=row&&row.dataset.id,pr=id&&profById(id);
    if(b.id==='pmDone'){close();return;}
    if(b.id==='pmAdd'){if(!sel)return;var nm=$('#pmNew').value;addProfile(sel,nm);sel=null;paint();return;}
    var act=b.dataset.act;
    if(act==='pick'){sel=b.dataset.a;paint();var n=$('#pmNew');if(n)n.focus();}
    else if(act==='av'&&pr){
      var free=AVATARS.filter(function(a){return taken().indexOf(a)<0||a===pr.av;}),i=free.indexOf(pr.av);
      pr.av=free[(i+1)%free.length];saveP();paint();
    }else if(act==='del'&&pr){
      if(armedId!==id){armedId=id;clearTimeout(armT);armT=setTimeout(function(){armedId=null;paint();},3500);paint();}
      else{armedId=null;delProfile(id);paint();}
    }
  };
  m.oninput=function(e){
    var i=e.target.closest('[data-act="nm"]');if(!i)return;
    var pr=profById(i.closest('.pm-row').dataset.id);if(pr){pr.name=i.value.trim().slice(0,16);saveP();}
  };
  paint();
}
function renderStickers(){
  var got=Object.keys(S.stickers).length;
  $('#s-stickers').innerHTML='<div class="card"><div class="book-head"><h2 class="sec" style="margin:0">My stickers</h2><div class="b-count"><b>'+got+'</b> of '+STICKERS.length+'</div></div>'+
    '<div class="sticker-grid">'+STICKERS.map(function(s,i){
      var has=!!S.stickers[s.id];
      return '<button class="cell" data-id="'+s.id+'" aria-label="'+(has?s.n:'Locked sticker')+'">'+stk(s,!has,has?((i*37)%9)-4:0)+'<span class="cell-n">'+(has?s.n:'?')+'</span></button>';
    }).join('')+'</div><div class="note" id="stkNote" aria-live="polite">Tap a sticker to find out more.</div></div>'+
    '<div class="actions"><button class="btn ghost" id="resetBtn">'+ic('\uD83D\uDDD1\uFE0F','Start over')+'</button></div>';
  var armed=false,t;
  $('#resetBtn').onclick=function(){
    var b=$('#resetBtn');
    if(!armed){armed=true;b.innerHTML=ic('\u26A0\uFE0F','Tap again to erase everything');clearTimeout(t);t=setTimeout(function(){armed=false;b.innerHTML=ic('\uD83D\uDDD1\uFE0F','Start over');},4000);}
    else{var prefs=S.prefs;S=fresh();S.prefs=prefs;save();updateCount();go('home');}
  };
}
$('#s-stickers').addEventListener('click',function(e){
  var c=e.target.closest('.cell');if(!c)return;
  var s=stickerById(c.dataset.id),note=$('#stkNote');
  if(S.stickers[s.id]){
    c.classList.remove('wiggle');void c.offsetWidth;c.classList.add('wiggle');
    note.textContent='Clover found a '+s.n.toLowerCase()+'!';voice([['r.s.'+s.id,s.n]]);
  }else{
    var m=MISSIONS.filter(function(x){return x.r===s.id;})[0];
    note.textContent='To get this one: '+m.x+' ('+Math.min(val(m),m.g)+' of '+m.g+')';sfx('tick');
  }
});
$('#s-home').addEventListener('click',function(e){
  var rb=e.target.closest('#homeRabbit');
  if(rb){mood(rb,'happy',1300);var hb=$('#s-home .bubble');if(hb)clover(hb.dataset.key);return;}
  var g=e.target.closest('[data-game]'),n=e.target.closest('[data-go]');
  if(g){sfx('tick');go('setup',g.dataset.game);}
  else if(n){sfx('tick');go(n.dataset.go);}
});

$('#s-play').addEventListener('click',function(e){
  var c=e.target.closest('#coach'),b=$('#s-play #bubble');
  if(c&&b&&b.dataset.key){mood(c,'happy',1300);clover(b.dataset.key);}
});

/* ---------- New sticker pop-up ---------- */
var revealing=false;
function flushReveal(){
  if(revealing||!S.queue.length||!audioReady)return;
  revealing=true;
  var it=S.queue[0],st=stickerById(it.sticker),m=$('#modal');
  m.hidden=false;
  m.innerHTML='<div class="modal-card" role="dialog" aria-label="New sticker"><div class="burst">New sticker!</div>'+
    '<div class="stk big"><span class="e">'+st.e+'</span></div><div class="m-name">'+st.n+'</div>'+
    '<p>Mission done: '+it.mission+'</p><button class="btn green big" id="yayBtn">'+ic('\uD83C\uDF89','Yay!')+'</button></div>';
  sfx('sticker');confetti(26);
  setTimeout(function(){voice([['c.sticker',LINES.sticker.toLowerCase()],['r.s.'+st.id,st.n]]);},700);
  $('#yayBtn').onclick=function(){
    S.queue.shift();save();m.hidden=true;m.innerHTML='';revealing=false;
    if(cur==='home')renderHome();else if(cur==='stickers')renderStickers();
    if(S.queue.length)setTimeout(flushReveal,250);
  };
}

/* ---------- Top bar ---------- */
function paintSound(){$('#soundBtn').innerHTML=S.prefs.sound?ICON.on:ICON.off;}
$('#backBtn').innerHTML=ICON.home+'<span>Home</span>';
$('#countIcon').innerHTML=carrotSVG('');
$('#backBtn').onclick=function(){sfx('tick');go('home');};
$('#soundBtn').onclick=function(){S.prefs.sound=!S.prefs.sound;save();paintSound();if(S.prefs.sound)sfx('tick');else stopVoice();};
function showSplash(){
  var m=$('#splash');m.hidden=false;
  m.innerHTML='<div class="modal-card splash-card"><div class="rabbit-wrap big" id="splashRabbit">'+rabbit()+'</div><div class="m-name">Bunny Meadow</div><button class="btn big" id="playBtn">'+ic('\u25B6\uFE0F','Let\'s play!')+'</button></div>';
  $('#playBtn').onclick=function(){
    audioReady=true;sfx('pop');m.hidden=true;m.innerHTML='';
    var hb=$('#s-home .bubble');if(hb&&cur==='home')clover(hb.dataset.key);
    var hr=$('#homeRabbit');if(hr)mood(hr,'happy',1300);
    preload();setTimeout(flushReveal,2500);
  };
}
['click','touchend'].forEach(function(ev){document.addEventListener(ev,function(){try{var c=ctx();if(c.state==='suspended')c.resume();}catch(e){}},{passive:true});});
if(P.list.length===1)setActive(P.list[0].id);
paintSound();updateCount();
go(KEY?'home':'who');
showSplash();
})();
</script>
